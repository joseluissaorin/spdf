name: kotlin

on:
  push:
    branches: [main]
    paths:
      - "kotlin/**"
      - "conformance/**"
      - ".github/workflows/kotlin.yml"
  pull_request:
    paths:
      - "kotlin/**"
      - "conformance/**"
      - ".github/workflows/kotlin.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Kotlin/JVM on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        working-directory: kotlin
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      # Unit tests of the three modules; the JDBC and the androidx.sqlite adapters each run
      # the whole conformance suite. No Android SDK is needed.
      - name: Build and test
        run: ./gradlew build --no-daemon
      - name: Conformance suite (CLI runner)
        run: ./gradlew :spdf:conformance --no-daemon
      - name: Upload conformance report
        if: always() && matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: conformance-kotlin
          path: kotlin/build/conformance.json
          if-no-files-found: error
