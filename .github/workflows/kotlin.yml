name: kotlin

on:
  push:
    branches: [main]
    paths:
      - "kotlin/**"
      - "conformance/**"
      - ".github/workflows/kotlin.yml"
  pull_request:
    paths:
      - "kotlin/**"
      - "conformance/**"
      - ".github/workflows/kotlin.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Kotlin/JVM on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        working-directory: kotlin
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      # Unit tests of the three modules; the JDBC and the androidx.sqlite adapters each run
      # the whole conformance suite. No Android SDK is needed.
      - name: Build and test
        run: ./gradlew build --no-daemon
      - name: Conformance suite (CLI runner)
        run: ./gradlew :spdf:conformance --no-daemon
      - name: Upload conformance report
        if: always() && matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: conformance-kotlin
          path: kotlin/build/conformance.json
          if-no-files-found: error

  android-device:
    # The Android adapter on a real Android runtime: the whole conformance suite runs as an
    # instrumented test on an emulator (the test-only module is enabled with -Pspdf.androidDevice).
    name: Android emulator (API ${{ matrix.api }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        api: [31, 35]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Conformance suite on the emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect
          working-directory: kotlin
          script: ./gradlew -Pspdf.androidDevice=true :spdf-android-device:connectedAndroidTest --no-daemon
      - name: Upload device test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-device-kotlin-api${{ matrix.api }}
          path: kotlin/spdf-android-device/build/outputs/androidTest-results
          if-no-files-found: ignore
