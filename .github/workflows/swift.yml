name: swift

on:
  push:
    branches: [main]
    paths:
      - "swift/**"
      - "Package.swift"
      - "conformance/**"
      - ".github/workflows/swift.yml"
  pull_request:
    paths:
      - "swift/**"
      - "Package.swift"
      - "conformance/**"
      - ".github/workflows/swift.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos:
    name: Swift on macOS and the iOS simulator
    runs-on: macos-latest
    defaults:
      run:
        working-directory: swift
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: swift --version && sqlite3 --version
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Unit tests and the whole suite (macOS)
        env:
          SPDF_SIGNED_OUT: ${{ runner.temp }}/swift-signed.spdf
        run: swift test
      - name: Signed by Swift, verified by the reference oracle (Python)
        run: python -c "import pathlib, sys; sys.path.insert(0, '../conformance/tools'); import spdfref as R; p = pathlib.Path(sys.argv[1]); r = R.validate_file(p); con = R.open_file(p); keys = {k for (k,) in con.con.execute(\"SELECT key FROM spdf_meta WHERE key IN ('content_sha256', 'signer', 'signature')\")}; con.close(); print(p.name, r['valid'], r['errors'], sorted(keys)); sys.exit(0 if r['valid'] and not r['errors'] and len(keys) == 3 else 1)" "$RUNNER_TEMP/swift-signed.spdf"
      - name: Conformance report
        run: swift run spdf-swift conformance ../conformance -o ../conformance.json
      - name: Tests on the iOS simulator (system SQLite of iOS)
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; print(next(x['udid'] for k,v in d.items() if 'iOS' in k for x in v if x['name'].startswith('iPhone')))")
          echo "Simulator: $UDID"
          xcodebuild test -scheme SPDF-Package -destination "id=$UDID" -only-testing:SPDFTests
      - name: The root manifest (what SwiftPM users get) builds and tests too
        working-directory: .
        run: swift test
      - name: Upload conformance report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: conformance-swift
          path: conformance.json
          if-no-files-found: error

  linux:
    name: Swift on Linux
    runs-on: ubuntu-latest
    container: swift:6.1-noble
    defaults:
      run:
        working-directory: swift
    steps:
      - uses: actions/checkout@v4
      - name: System SQLite and zlib
        run: apt-get update && apt-get install -y --no-install-recommends libsqlite3-dev zlib1g-dev
      - name: Unit tests and the whole suite (Linux)
        run: swift test
