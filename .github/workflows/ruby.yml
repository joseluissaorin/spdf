name: ruby

on:
  push:
    branches: [main]
    paths: ["ruby/**", "conformance/**", ".github/workflows/ruby.yml"]
  pull_request:
    paths: ["ruby/**", "conformance/**", ".github/workflows/ruby.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ruby: ["3.1", "3.3", "3.4"]
    defaults:
      run:
        working-directory: ruby
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
          working-directory: ruby
      - name: Unit tests
        run: bundle exec rake test
      - name: Conformance
        if: always()
        shell: bash
        run: |
          set -o pipefail
          bundle exec ruby -Ilib exe/spdf conformance ../conformance > conformance.json
      - name: Gem builds
        run: gem build spdf-format.gemspec
      - name: Upload conformance report
        if: always() && matrix.ruby == '3.4'
        uses: actions/upload-artifact@v4
        with:
          name: conformance-ruby
          path: ruby/conformance.json
          if-no-files-found: warn
