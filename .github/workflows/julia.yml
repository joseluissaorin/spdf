name: julia

on:
  push:
    branches: [main]
    paths: ["julia/**", "conformance/**", ".github/workflows/julia.yml"]
  pull_request:
    paths: ["julia/**", "conformance/**", ".github/workflows/julia.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        version: ["1.10", "1"]
        os: [ubuntu-latest]
        include:
          - version: "1"
            os: macos-latest
    defaults:
      run:
        working-directory: julia
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.version }}
      - uses: julia-actions/cache@v2
      - name: Tests
        run: julia --project=. -e 'using Pkg; Pkg.instantiate(); Pkg.test()'
      - name: Conformance
        if: always()
        run: julia --project=. bin/conformance.jl ../conformance > /dev/null
      - name: Upload conformance report
        if: always() && matrix.version == '1' && matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: conformance-julia
          path: julia/conformance.json
          if-no-files-found: warn
