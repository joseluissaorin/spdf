name: php

on:
  push:
    branches: [main]
    paths: ["php/**", "conformance/**", "spec/schema/**", ".github/workflows/php.yml"]
  pull_request:
    paths: ["php/**", "conformance/**", "spec/schema/**", ".github/workflows/php.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ["8.1", "8.2", "8.3", "8.4"]
    defaults:
      run:
        working-directory: php
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_sqlite, intl, mbstring, zlib, sodium
          coverage: none
      - name: SQLite used by PHP
        run: php -r '$p = new PDO("sqlite::memory:"); echo $p->query("select sqlite_version()")->fetchColumn(), PHP_EOL; $p->exec("create virtual table t using fts5(a, tokenize=\"trigram\")");'
      - run: composer install --no-interaction --no-progress
      - name: Unit tests
        run: vendor/bin/phpunit
      - name: Conformance
        if: always()
        shell: bash
        run: |
          set -o pipefail
          php bin/spdf conformance ../conformance > conformance.json
      - name: Upload conformance report
        if: always() && matrix.php == '8.4'
        uses: actions/upload-artifact@v4
        with:
          name: conformance-php
          path: php/conformance.json
          if-no-files-found: warn
