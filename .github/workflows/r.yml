name: r

on:
  push:
    branches: [main]
    paths: ["r/**", "conformance/**", ".github/workflows/r.yml"]
  pull_request:
    paths: ["r/**", "conformance/**", ".github/workflows/r.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    env:
      R_KEEP_PKG_SOURCE: yes
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-pandoc@v2
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          working-directory: r
          extra-packages: any::rcmdcheck, any::dplyr
          needs: check
      - uses: r-lib/actions/check-r-package@v2
        with:
          working-directory: r
          args: 'c("--no-manual", "--as-cran")'
          error-on: '"warning"'
      - name: Conformance
        if: always()
        working-directory: r
        shell: bash
        run: |
          R CMD INSTALL .
          Rscript inst/scripts/conformance.R ../conformance > /dev/null
      - name: Upload conformance report
        if: always() && matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: conformance-r
          path: r/conformance.json
          if-no-files-found: warn
