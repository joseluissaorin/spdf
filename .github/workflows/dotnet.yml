name: dotnet

on:
  push:
    branches: [main]
    paths:
      - "dotnet/**"
      - "conformance/**"
      - ".github/workflows/dotnet.yml"
  pull_request:
    paths:
      - "dotnet/**"
      - "conformance/**"
      - ".github/workflows/dotnet.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "1"

jobs:
  test:
    name: .NET on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        working-directory: dotnet
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Restore
        run: dotnet restore Spdf.sln
      - name: Build
        run: dotnet build Spdf.sln -c Release --no-restore
      - name: Test (unit tests and the whole conformance suite)
        run: dotnet test Spdf.sln -c Release --no-build
      - name: Conformance suite
        run: dotnet run --project src/Spdf.Cli -c Release --no-build -- conformance ../conformance -o ../conformance.json
      - name: Pack
        run: dotnet pack src/Spdf.Format/Spdf.Format.csproj -c Release --no-build -o artifacts
      - name: Upload conformance report
        if: matrix.os == 'ubuntu-latest' && always()
        uses: actions/upload-artifact@v4
        with:
          name: conformance-dotnet
          path: conformance.json
          if-no-files-found: error
