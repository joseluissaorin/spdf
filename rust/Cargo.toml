[workspace]
resolver = "2"
members = ["crates/spdf", "crates/spdf-cli", "crates/spdf-ffi"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
license = "MIT OR Apache-2.0"
authors = ["José Luis Saorín Ferrer <jl@joseluissaorin.com>"]
repository = "https://github.com/joseluissaorin/spdf"
homepage = "https://spdf.joseluissaorin.com"
keywords = ["spdf", "citation", "sqlite", "documents", "search"]
categories = ["parser-implementations", "text-processing", "database"]

[workspace.dependencies]
spdf = { path = "crates/spdf", version = "0.1.0" }
rusqlite = { version = "0.40", features = ["bundled", "backup", "serialize", "blob", "limits"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
