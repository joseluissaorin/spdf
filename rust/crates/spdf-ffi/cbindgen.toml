language = "C"
include_guard = "SPDF_H"
cpp_compat = true
documentation = true
documentation_style = "c"
autogen_warning = "/* Generated by cbindgen from rust/crates/spdf-ffi. Do not edit by hand: run `cbindgen --config cbindgen.toml --output include/spdf.h` in rust/crates/spdf-ffi. */"
header = """/*
 * spdf.h: C ABI of the SPDF reference implementation (Rust).
 *
 * Conventions: every function returns an int status (SPDF_OK = 0) and writes its
 * result through an out parameter. Strings are UTF-8 and NUL-terminated; strings
 * returned by the library are owned by the caller and released with
 * spdf_string_free(); byte buffers with spdf_bytes_free(). Complex values are JSON.
 * After a failure, spdf_last_error() returns {"status","code","message"} for the
 * calling thread. A SpdfDoc handle may be used from one thread at a time.
 *
 * SPDX-License-Identifier: MIT OR Apache-2.0
 */"""
sys_includes = ["stddef.h", "stdint.h"]
no_includes = true
usize_is_size_t = true

[export]
include = ["SpdfDoc"]

[parse]
parse_deps = false
