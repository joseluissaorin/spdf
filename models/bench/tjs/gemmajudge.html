<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><title>SPDF models bench (Gemma 4 judge in the browser)</title>
<script type="importmap">
{ "imports": {
  "@huggingface/transformers": "/tjs/transformers.js",
  "onnxruntime-web/webgpu": "/ort/ort.webgpu.bundle.min.mjs",
  "onnxruntime-web": "/ort/ort.webgpu.bundle.min.mjs",
  "@noble/hashes/sha2.js": "/noble/sha2.js",
  "@noble/hashes/utils.js": "/noble/utils.js",
  "@mediapipe/tasks-genai": "/mp/genai_bundle.mjs",
  "spdf-infer-web": "/web/index.js"
} }
</script>
</head>
<body>
<pre id="log"></pre>
<script type="module">
import * as T from "@huggingface/transformers";
import { Judge, pairContent, RELATIONS, RELATION_DESCRIPTIONS, RELEVANCE_LABELS } from "spdf-infer-web";
const log = (msg) => { document.getElementById("log").textContent += msg + "\n"; fetch("/log", { method: "POST", body: JSON.stringify({ msg }) }); };
const post = (r) => fetch("/result", { method: "POST", body: JSON.stringify(r) });
const SUPPORT_TASK = "Checking academic citations. Does the passage support the claim, so that a skeptical reader checking the citation would agree the source says it?";
const YESNO = [{ name: "YES", description: "The passage states or clearly entails the claim." }, { name: "NO", description: "The passage only shares the topic, says something different, or contradicts the claim." }];
const REL = RELATIONS.map((r) => ({ name: r, description: RELATION_DESCRIPTIONS[r] }));
const RELATION_TASK = "Checking academic citations. How does the passage relate to the claim?";
const RELEVANCE_TASK = "Search relevance. How well does the passage answer the query?";
const lg = (ps) => ps.map(([, p]) => Math.log(Math.max(p, 1e-12)));
try {
  const cfg = await (await fetch("/config.json")).json();
  T.env.localModelPath = "/models/"; T.env.allowLocalModels = true; T.env.allowRemoteModels = false; T.env.useBrowserCache = false;
  T.env.backends.onnx.wasm.wasmPaths = "/ort/";
  const t0 = performance.now();
  const judge = await Judge.fromTransformers(T, cfg.repo, { device: cfg.device, dtype: cfg.dtype });
  log(`loaded in ${((performance.now() - t0) / 1000).toFixed(1)} s`);
  await post({ priors: { support: lg(await judge.classify(SUPPORT_TASK, "N/A", YESNO)), relation: lg(await judge.classify(RELATION_TASK, "N/A", REL)),
                         relevance: lg(await judge.classify(RELEVANCE_TASK, "N/A", RELEVANCE_LABELS)) } });
  let pairs = (await (await fetch("/judges/pairs.jsonl")).text()).trim().split("\n").map((l) => JSON.parse(l));
  const rel = pairs.filter((p) => p.kind === "relevance");
  pairs = [...pairs.filter((p) => p.kind === "support"), ...rel.filter((_, i) => i % cfg.every === 0)];
  if (cfg.limit) pairs = pairs.slice(0, cfg.limit);
  for (const p of pairs) {
    const t = performance.now();
    let row;
    if (p.kind === "support") {
      const c = pairContent(p.claim, p.passage, p.source);
      row = { support_logits: lg(await judge.classify(SUPPORT_TASK, c, YESNO)), relation_logits: lg(await judge.classify(RELATION_TASK, c, REL)) };
    } else {
      row = { relevance_logits: lg(await judge.classify(RELEVANCE_TASK, `Query: ${p.query.trim()}\nPassage: ${p.passage.trim()}`, RELEVANCE_LABELS)) };
    }
    await post({ id: p.id, ms: performance.now() - t, ...row });
  }
  await post({ done: true });
} catch (e) {
  log("ERROR " + (e?.stack ?? e));
  await post({ error: String(e?.stack ?? e) });
}
</script>
</body>
</html>
