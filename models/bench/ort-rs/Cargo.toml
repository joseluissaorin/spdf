[package]
name = "spdf-bench-ort"
version = "0.1.0"
edition = "2021"
publish = false
license = "MIT OR Apache-2.0"
description = "onnxruntime (Rust `ort`) engine for the SPDF models bench"

[dependencies]
ort = { version = "=2.0.0-rc.13", features = ["download-binaries", "ndarray"] }
ndarray = "0.17"
ndarray-npy = { version = "0.10", default-features = false, features = ["npz"] }
anyhow = "1"
serde_json = "1"

[workspace]
