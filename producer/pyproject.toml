[project]
name = "spdf-build"
version = "0.1.0"
description = "Reference producer for SPDF 5.0: turns PDFs, scans, photos, EPUB, office files, audio, video and web pages into read, citable SPDF files."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT OR Apache-2.0"
authors = [{ name = "José Luis Saorín Ferrer" }]
keywords = ["spdf", "documents", "citation", "ocr", "embeddings", "transcription"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Topic :: Text Processing :: Indexing",
  "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
  "spdf-format>=0.1",
  "pymupdf>=1.24",
  "pillow>=10",
  "numpy>=1.26",
]

[project.optional-dependencies]
local = [
  "torch>=2.6",
  "sentence-transformers[image]>=6.1.0",
  "transformers>=5.18",
  "torchcodec>=0.17; platform_system != 'Windows'",
  "soundfile",
  "mlx-vlm>=0.3; platform_system == 'Darwin' and platform_machine == 'arm64'",
  "mlx-whisper>=0.4; platform_system == 'Darwin' and platform_machine == 'arm64'",
]
test = ["pytest>=8"]

[project.scripts]
spdf-build = "spdf_build.cli:main"

[project.entry-points."spdf.commands"]
build = "spdf_build.cli:register"
revectorize = "spdf_build.cli:register_revectorize"

[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/spdf_build"]

[tool.uv.sources]
spdf-format = { path = "../python", editable = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "models: needs downloaded models (EmbeddingGemma 2, Gemma 4, whisper); skipped in CI",
  "network: needs internet; skipped in CI",
]
addopts = "-m 'not models and not network'"
